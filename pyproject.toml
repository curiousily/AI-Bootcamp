[project]
name = "mlexpert_bootcamp"
version = "1.0.0"
description = "AI Engineering Open Bootcamp"
readme = "README.md"
requires-python = ">=3.13.9"
dependencies = [
    "ipywidgets>=8.1.9",
    "ipython>=9.17.1",
    "jupyterlab>=4.6.4",
    "markdown>=3.11",
    "matplotlib>=3.11.2",
    "openai>=3.28.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
